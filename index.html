<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BLNCR鳥図鑑</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="BLNCR鳥図鑑">

    <link rel="apple-touch-icon" href="favicon2.png"> 
    <link rel="icon" type="image/png" sizes="192x192" href="favicon3.png">
    
    <link rel="icon" href="favicon.ico"> 
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

</head>

<body class="">

    <div id="background-overlay"></div>

    <header id="header" class="bg-white shadow-md fixed top-0 z-20 w-full max-w-lg mx-auto">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between h-16">
            <button id="backButton" class="text-emerald-600 hidden w-20 text-left">&lt; 戻る</button>
            <h1 id="headerTitle" class="text-xl font-bold text-gray-800 text-center flex-grow">鳥図鑑</h1>
            <div id="headerActions" class="flex items-center space-x-1 w-20 justify-end">
                 <button id="search-toggle-button" class="header-action-button p-2 text-gray-600 hover:text-emerald-600 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </button>
                <button id="filter-toggle-button" class="header-action-button p-2 text-gray-600 hover:text-emerald-600 rounded-lg relative">
                    <span id="filter-active-dot" class="hidden absolute top-1 right-1 w-2.5 h-2.5 bg-green-500 rounded-full border-2 border-white"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>
                </button>
                 <button id="view-toggle-button" class="header-action-button p-2 text-gray-600 hover:text-emerald-600 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" /></svg>
                </button>
            </div>
        </div>
        
       <div id="search-popup" class="fixed top-16 z-10 w-full max-w-lg mx-auto bg-white border-t border-gray-200 p-4 hidden"></div>
        <div id="filter-popup" class="fixed top-16 z-10 w-full max-w-lg mx-auto bg-gray-50 border-t border-b border-gray-200 hidden overflow-y-auto" style="max-height: calc(100vh - 4rem);"></div>
        <div id="view-popup" class="fixed top-16 z-10 w-full max-w-lg mx-auto bg-gray-50 border-t border-b border-gray-200 hidden overflow-y-auto" style="max-height: calc(100vh - 4rem);"></div>
    </header>

    <main id="app" class="container mx-auto max-w-lg p-2"></main>

    <nav class="bg-white border-t border-gray-200 fixed bottom-0 left-0 right-0 max-w-lg mx-auto h-16 flex justify-around items-center z-30">
        
        <button id="tab-pokedex" class="tab-button flex-1 flex flex-col items-center justify-center h-full text-sm font-medium tab-active">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mb-1">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
            </svg>
            図鑑
        </button>
        
        <button id="tab-events" class="tab-button flex-1 flex flex-col items-center justify-center h-full text-sm font-medium tab-inactive">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
            イベント
        </button>
        
        <button id="tab-manual" class="tab-button flex-1 flex flex-col items-center justify-center h-full text-sm font-medium tab-inactive">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0-2.062.18 3 .512v14.25A8.987 8.987 0 0018 18c-2.305 0-4.408.867-6 2.292m0-14.25v14.25" />
            </svg>
            説明書
        </button>
        
        <button id="tab-settings" class="tab-button flex-1 flex flex-col items-center justify-center h-full text-sm font-medium tab-inactive">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 mb-1">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75a4.5 4.5 0 0 1-4.884 4.484c-1.076-.091-2.264.071-2.95.904l-7.152 8.684a2.548 2.548 0 1 1-3.586-3.586l8.684-7.152c.833-.686.995-1.874.904-2.95a4.5 4.5 0 0 1 6.336-4.486l-3.276 3.276a3.004 3.004 0 0 0 2.25 2.25l3.276-3.276c.256.565.398 1.192.398 1.852Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.867 19.125h.008v.008h-.008v-.008Z" />
            </svg>
            設定
        </button>
    </nav>

    <div id="custom-confirm-modal" class="hidden fixed inset-0 w-full h-full flex items-center justify-center z-60"
         style="background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);">    
    
        <div class="bg-white rounded-xl shadow-2xl p-6 m-4 max-w-sm w-full"
             style="animation: modal-fade-in 0.2s ease-out;">
            
            <h3 id="confirm-modal-title" class="text-xl font-bold text-gray-900 mb-3">確認</h3>
            
            <p id="confirm-modal-text" class="text-gray-600 mb-6 whitespace-pre-wrap">本当に実行しますか？</p>
            
            <div class="flex justify-end space-x-3">
                <button id="confirm-btn-cancel" 
                        class="px-4 py-2 rounded-lg font-semibold shadow transition-transform transform active:scale-95 bg-gray-200 text-gray-700 hover:bg-gray-300">
                    キャンセル
                </button>
                <button id="confirm-btn-ok" 
                        class="px-4 py-2 rounded-lg font-semibold shadow transition-transform transform active:scale-95 bg-red-600 text-white hover:bg-red-700">
                    OK
                </button>
            </div>
        </div>
    </div>

    <div id="edit-form-modal" class="hidden fixed inset-0 z-40 bg-gray-100 max-w-lg mx-auto">
        <header class="bg-white shadow-md fixed top-0 z-50 w-full max-w-lg mx-auto">
            <div class="container mx-auto px-4 py-3 flex items-center justify-between h-16">
                <button id="edit-form-cancel-btn" class="text-emerald-600 w-20 text-left">&lt; 中止</button>
                <h1 id="edit-form-title" class="text-xl font-bold text-gray-800 text-center flex-grow">編集</h1>
                <div class="w-20 text-right">
                    </div>
            </div>
        </header>
        
        <div id="edit-form-content-area" class="pt-16 pb-4 h-full overflow-y-auto">
            </div>
    </div>    
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@7/build/umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script> 

    <script src="app.js"></script>
    
    <script src="events.js"></script>
    <script src="pokedex.js"></script>
    <script src="settings.js"></script>
    <script src="manual.js"></script> 
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>

</body>
</html>
