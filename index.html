<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BLNCR鳥図鑑</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <meta name="theme-color" content="#059669">
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
    <div id="header" class="fixed top-0 left-0 right-0 bg-emerald-600 text-white p-4 flex items-center justify-between shadow-md z-30 h-16">
        <button id="backButton" class="hidden text-white p-2 -ml-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 id="headerTitle" class="text-xl font-bold flex-grow text-center">鳥図鑑</h1>
        <div id="headerActions" class="flex items-center space-x-2">
            <button id="search-toggle-button" class="hidden text-white p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
            <button id="filter-toggle-button" class="relative hidden text-white p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                <span id="filter-active-dot" class="absolute top-1 right-1 block w-2 h-2 bg-red-500 rounded-full hidden"></span>
            </button>
            <button id="view-toggle-button" class="hidden text-white p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            </button>
        </div>
    </div>

    <div id="popup-container" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden flex items-start justify-center pt-16">
        <div id="search-popup" class="bg-white rounded-lg shadow-xl m-4 p-4 w-11/12 max-w-md hidden"></div>
        <div id="filter-popup" class="bg-white rounded-lg shadow-xl m-4 p-0 w-11/12 max-w-md hidden overflow-hidden"></div>
        <div id="view-popup" class="bg-white rounded-lg shadow-xl m-4 p-0 w-11/12 max-w-md hidden overflow-hidden"></div>
    </div>

    <main id="app" class="flex-grow pb-16"></main> 

    <div id="footer" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-20">
        <nav class="flex justify-around h-16">
            <button id="tab-pokedex" class="tab-button flex-1 flex flex-col items-center justify-center text-sm text-gray-500 tab-active">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375H12a1.125 1.125 0 0 1-1.125-1.125V10.5M19.5 14.25a2.25 2.25 0 0 0 2.25-2.25V9a2.25 2.25 0 0 0-2.25-2.25h-5.875a1.125 1.125 0 0 1-1.125-1.125V3.625M19.5 14.25H12m0 0l-1.5 1.5m-6.75-6.75h7.5A2.25 2.25 0 0 1 21 7.5v7.5a2.25 2.25 0 0 1-2.25 2.25H6.75a2.25 2.25 0 0 1-2.25-2.25V9a2.25 2.25 0 0 1 2.25-2.25h3.375c.621 0 1.125.504 1.125 1.125V10.5m-9 0L10.5 21v-3.75"></path></svg>
                <span>図鑑</span>
            </button>
            <button id="tab-events" class="tab-button flex-1 flex flex-col items-center justify-center text-sm text-gray-500 tab-inactive">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>イベント</span>
            </button>
            <button id="tab-birdercard" class="tab-button flex-1 flex flex-col items-center justify-center text-sm text-gray-500 tab-inactive">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10v6m0 0v2a2 2 0 002 2h14a2 2 0 002-2v-2M3 16h18M3 10V6a2 2 0 012-2h14a2 2 0 012 2v4M3 10h18"></path></svg>
                <span>バーダーカード</span>
            </button>
            <button id="tab-settings" class="tab-button flex-1 flex flex-col items-center justify-center text-sm text-gray-500 tab-inactive">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>設定</span>
            </button>
        </nav>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/bird-pokedex/service-worker.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@6.2.0/dist/umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>

    <script src="js/app-state.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pokedex.js"></script>
    <script src="js/events.js"></script>
    <script src="js/birdercard.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
